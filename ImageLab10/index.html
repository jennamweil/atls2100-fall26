<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>

      <a-assets>
        <img id="beach" src="assets/beach.jpg">
        <img id="block" src="assets/sand-texture.jpg">
        <img id="cone" src="assets/ice-cream-cone-texture.jpeg">
        <img id="scoop" src="assets/ice-cream-texture.jpeg">
      </a-assets>
  
    <a-scene>
    
      <a-box position="-1 0.5 -3" rotation="0 45 0" src="#block"></a-box>
      <a-box position="-1 1.5 -2.5" rotation="0 90 0" src="#block"></a-box>
      <a-box position="-1 0.5 -2.5" rotation="0 45 0" src="#block"></a-box>

      <a-sphere position="1 2.25 -3" radius="1.25" src="#scoop"></a-sphere>
      <a-cone position="1 0.75 -3" radius="0.5" height="1.5" src="#cone" rotation="-180 0 0"></a-cone>
      <a-sky src="#beach"></a-sky>
    </a-scene>
  </body>
</html>
